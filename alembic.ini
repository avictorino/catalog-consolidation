# Alembic configuration.
#
# The consolidation tool drives Alembic programmatically from
# consolidation.pipeline, injecting the live connection (config.attributes
# ["connection"]) so the refactor runs inside the single import transaction.
# This file exists for direct `alembic` CLI use during development.

[alembic]
script_location = migrations
prepend_sys_path = src
# Overridden at runtime by the injected connection; a value is only needed for
# the bare `alembic` CLI.
sqlalchemy.url = sqlite:///catalog_output.db

[loggers]
keys = root,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(asctime)s [%(levelname)s] %(name)s %(message)s
datefmt = %H:%M:%S
